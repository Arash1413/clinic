<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>کلینیک تخصصی دکتر | زیبایی و سلامت</title>
    
    <!-- Bootstrap RTL -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css">
    
    <!-- فونت زیبا و استاندارد وزیر -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    
    <!-- کتابخانه نمایش بزرگ عکس‌ها -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.2.0/css/glightbox.min.css">

    <style>
        :root { 
            /* رنگ‌بندی جدید هماهنگ با تصویر هیرو */
            --primary-color: #d69da9; 
            --primary-hover: #c58c98;
            --secondary-color: #6c757d; 
            --accent-color: #fcf8f8;
            --dark-text: #4a4040;
        }
        
        body { 
            font-family: 'Vazirmatn', sans-serif; 
            background-color: #ffffff; 
            color: #333; 
            line-height: 1.8;
        }

        .navbar { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(10px); 
            box-shadow: 0 2px 15px rgba(0,0,0,0.05); 
        }
        
        .nav-link {
            font-weight: 500;
            color: var(--dark-text) !important;
        }

        .nav-link:hover {
            color: var(--primary-color) !important;
        }

        /* دکمه‌های تم رزگلد */
        .btn-primary { 
            background-color: var(--primary-color) !important;
            border-color: var(--primary-color) !important;
            border-radius: 50px; 
            padding: 10px 28px; 
            font-weight: bold;
            transition: 0.3s; 
        }

        .btn-primary:hover {
            background-color: var(--primary-hover) !important;
            transform: scale(1.05);
        }

        .text-primary { color: var(--primary-color) !important; }

        footer { 
            background: #2b2626; 
            color: #ccc; 
            padding: 60px 0 30px; 
            margin-top: 50px;
        }

        .card { 
            border: none; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            transition: 0.4s ease; 
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg sticky-top py-3">
        <div class="container">
            <a class="navbar-brand fw-bold fs-3" href="{% url 'home' %}" style="color: var(--primary-color);">DR. CLINIC</a>
            
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}">صفحه اصلی</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'home' %}#services">خدمات</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'gallery' %}">گالری نمونه کار</a></li>
                    <li class="nav-item"><a class="nav-link" href="{% url 'blog_list' %}">مجله سلامتی</a></li>
                </ul>
                <a href="{% url 'book_appointment' %}" class="btn btn-primary ms-lg-4 shadow-sm">رزرو نوبت آنلاین</a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <div class="container text-center">
            <h4 class="text-white fw-bold mb-3">کلینیک تخصصی زیبایی دکتر ...</h4>
            <p>ارائه دهنده برترین خدمات زیبایی با استانداردهای جهانی</p>
            <hr class="bg-secondary opacity-25">
            <p class="mb-0">تمامی حقوق برای کلینیک محفوظ است &copy; ۲۰۲۴</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/glightbox/3.2.0/js/glightbox.min.js"></script>
    <script>
        const lightbox = GLightbox({ touchNavigation: true, loop: true });
    </script>
</body>
</html>
