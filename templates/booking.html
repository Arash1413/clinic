{% extends 'base.html' %}
{% block content %}
<div class="container my-5 py-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card p-4 p-lg-5">
                <div class="text-center mb-4">
                    <h2 class="fw-bold text-primary">رزرو نوبت آنلاین</h2>
                    <p class="text-muted">لطفاً فرم زیر را با دقت پر کنید تا با شما تماس بگیریم.</p>
                </div>
                
                <form method="post">
                    {% csrf_token %}
                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold">نام و نام خانوادگی</label>
                            {{ form.full_name }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">شماره موبایل</label>
                            {{ form.phone }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">نوع خدمت مورد نظر</label>
                            {{ form.service }}
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">تاریخ پیشنهادی</label>
                            {{ form.date }}
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-bold">توضیحات تکمیلی</label>
                            {{ form.message }}
                        </div>
                        <div class="col-12 mt-4">
                            <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow">ثبت درخواست و رزرو</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
